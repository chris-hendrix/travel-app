name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for same workflow + PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Permissions for GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read

jobs:
  # Step 1: Detect what changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            mobile:
              - 'apps/mobile/**'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/**'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
            devcontainer:
              - '.devcontainer/**'
              - 'Makefile'

  # Step 2: Lint + Type Check
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # On main: run all
      - name: Lint (all)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: pnpm lint

      - name: Type check (all)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: pnpm typecheck

      # On PR: run affected only
      - name: Lint (affected)
        if: github.event_name == 'pull_request'
        run: pnpm turbo lint --affected

      - name: Type check (affected)
        if: github.event_name == 'pull_request'
        run: pnpm turbo typecheck --affected

      - name: Dependency audit
        run: pnpm audit --audit-level=high --ignore-registry-errors

  # Step 2b: Devcontainer config validation (no Node/pnpm needed)
  devcontainer:
    name: Devcontainer Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Validate devcontainer config
        run: bash .github/scripts/test-devcontainer.test.sh

  # Step 2c: Mobile checks
  mobile-checks:
    name: Mobile Checks
    runs-on: ubuntu-latest
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.mobile == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint, typecheck and test (mobile)
        run: pnpm turbo lint typecheck test --filter=@journiful/mobile

      - name: Expo doctor
        run: pnpm --filter @journiful/mobile exec expo-doctor

  # Step 3: Unit Tests (API)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    # Run if API changed OR on main branch OR shared files changed
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.shared == 'true'
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://journiful:journiful123@localhost:5432/journiful
      JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing-purposes-only
      FRONTEND_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journiful
          POSTGRES_PASSWORD: journiful123
          POSTGRES_DB: journiful
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run database migrations
        run: pnpm --filter @journiful/api db:migrate

      - name: Run unit tests
        run: pnpm --filter @journiful/api test

  # Step 4: E2E Tests (sharded)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.shared == 'true'
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      NODE_ENV: test
      GEOCODING_STUB: true
      DATABASE_URL: postgresql://journiful:journiful123@localhost:5432/journiful
      JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing-purposes-only
      FRONTEND_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journiful
          POSTGRES_PASSWORD: journiful123
          POSTGRES_DB: journiful
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @journiful/web exec playwright install --with-deps

      - name: Run database migrations
        run: pnpm --filter @journiful/api db:migrate

      - name: Run E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm --filter @journiful/web exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Blob Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/web/blob-report/
          retention-days: 1

  # Step 4c: Merge E2E Reports
  merge-e2e-reports:
    name: Merge E2E Reports
    needs: e2e-tests
    if: ${{ !cancelled() && needs.e2e-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Blob Reports
        uses: actions/download-artifact@v8
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Reports
        run: |
          pnpm --filter @journiful/web exec playwright merge-reports --reporter=html ./all-blob-reports
          echo '### E2E Test Report' >> $GITHUB_STEP_SUMMARY
          echo 'Full HTML report available in the **playwright-report** artifact.' >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML Report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  # Step 4b: Mobile E2E Tests (sharded, chromium-only)
  mobile-e2e-tests:
    name: Mobile E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.mobile == 'true' ||
      needs.changes.outputs.shared == 'true'
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    env:
      NODE_ENV: test
      GEOCODING_STUB: true
      DATABASE_URL: postgresql://journiful:journiful123@localhost:5432/journiful
      JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing-purposes-only
      FRONTEND_URL: http://localhost:3000,http://localhost:8081

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journiful
          POSTGRES_PASSWORD: journiful123
          POSTGRES_DB: journiful
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (mobile, chromium only)
        run: pnpm --filter @journiful/mobile exec playwright install --with-deps chromium

      - name: Run database migrations
        run: pnpm --filter @journiful/api db:migrate

      - name: Run Mobile E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm --filter @journiful/mobile exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Mobile Blob Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: mobile-blob-report-${{ matrix.shardIndex }}
          path: apps/mobile/blob-report/
          retention-days: 1

  # Step 4e: Mobile web export gate — build dist/ then verify it
  mobile-web-export:
    name: Mobile Web Export
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      needs.changes.outputs.mobile == 'true'
    env:
      NODE_ENV: test
      GEOCODING_STUB: true
      DATABASE_URL: postgresql://journiful@localhost:5432/journiful
      JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing-purposes-only
      FRONTEND_URL: http://localhost:3000,http://localhost:8081

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: journiful
          # A throwaway database on the runner loopback needs no password,
          # and trust auth keeps a credential-shaped literal out of the diff.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: journiful
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install Playwright Browsers (mobile, chromium only)
        run: pnpm --filter @journiful/mobile exec playwright install --with-deps chromium

      - name: Run database migrations
        run: pnpm --filter @journiful/api db:migrate

      # The export bakes its API origin in at build time, so it must carry
      # the local test origin — this artifact is only exercised, never deployed.
      # --clear lives in the export:web script: EXPO_PUBLIC_API_URL is inlined
      # by Babel at transform time and is not part of Metro's cache key, so a
      # cached transform would silently ship a previous build's origin.
      - name: Build the web export
        run: pnpm --filter @journiful/mobile exec expo export --platform web --clear
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000/api

      # dist/ now exists, so web-export.test.ts executes instead of skipping.
      - name: Export shape assertions
        run: pnpm --filter @journiful/mobile test

      - name: Run Mobile E2E Tests against the export
        run: pnpm --filter @journiful/mobile exec playwright test
        env:
          MOBILE_WEB_TARGET: export

  # Step 4d: Merge Mobile E2E Reports
  merge-mobile-e2e-reports:
    name: Merge Mobile E2E Reports
    needs: mobile-e2e-tests
    if: ${{ !cancelled() && needs.mobile-e2e-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Mobile Blob Reports
        uses: actions/download-artifact@v8
        with:
          path: apps/mobile/all-blob-reports
          pattern: mobile-blob-report-*
          merge-multiple: true

      - name: Merge Mobile Reports
        run: |
          pnpm --filter @journiful/mobile exec playwright merge-reports --reporter=html ./all-blob-reports
          echo '### Mobile E2E Test Report' >> $GITHUB_STEP_SUMMARY
          echo 'Full HTML report available in the **playwright-report-mobile** artifact.' >> $GITHUB_STEP_SUMMARY

      - name: Upload Mobile HTML Report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-mobile
          path: apps/mobile/playwright-report/
          retention-days: 30
