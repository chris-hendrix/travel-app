name: Distribute Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/distribute.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/distribute.yml'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.journiful.app/api
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: Swisyn/setup-android-sdk@v1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app for mobile
        run: make build-mobile

      - name: Sync Capacitor assets
        run: cd apps/web && npx cap sync

      - name: Build debug APK
        run: |
          cd apps/web/android
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr '/' '-')
          ./gradlew assembleDebug \
            -PversionNameOverride="${BRANCH_NAME}-${GITHUB_SHA::7}"
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  distribute:
    name: Distribute to Firebase
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    env:
      NEXT_PUBLIC_API_URL: https://api.journiful.app/api
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: Swisyn/setup-android-sdk@v1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Google Services JSON
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > apps/web/android/app/google-services.json

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Generate release notes with branch name
        run: echo "[$(echo '${{ github.head_ref || github.ref_name }}' | tr '/' '-')] $(git log -1 --pretty=%B)" > /tmp/release-notes.txt

      - name: Build web app for mobile
        run: make build-mobile

      - name: Sync Capacitor assets
        run: cd apps/web && npx cap sync

      - name: Build and distribute to Firebase
        run: |
          cd apps/web/android
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr '/' '-')
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json \
            ./gradlew assembleDebug appDistributionUploadDebug \
            -PbuildNumber=$GITHUB_RUN_NUMBER \
            -PversionNameOverride="${BRANCH_NAME}-${GITHUB_SHA::7}" \
            -Ptesters="${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}" \
            -PreleaseNotesFile=/tmp/release-notes.txt
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      - name: Cleanup temp files
        if: always()
        run: rm -f /tmp/firebase-sa.json /tmp/release-notes.txt
