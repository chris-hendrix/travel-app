name: Distribute Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'shared/**'
      - '.github/workflows/distribute.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'shared/**'
      - '.github/workflows/distribute.yml'
  workflow_dispatch:

# Cancel in-progress runs for same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://api.journiful.app/api
      # Prebuild mutates the checkout (version write below); expo refuses
      # to run on a dirty tree without this.
      EXPO_NO_GIT_STATUS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: Swisyn/setup-android-sdk@v1
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The FCM client config is per-app and untracked: prebuild copies it
      # into android/app/google-services.json, and gradle fails loudly if
      # it is missing (which is the failure this step cannot swallow).
      - name: Write Google Services JSON
        run: |
          cat << 'EOF' > apps/mobile/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      # Same upload key as the local builds and Play: an APK signed with a
      # different key cannot upgrade an installed one (it demands an
      # uninstall), and its fingerprint would not match assetlinks.json.
      - name: Write upload keystore and gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "${{ secrets.ANDROID_UPLOAD_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/journiful-upload.keystore"
          {
            echo "JOURNIFUL_KEYSTORE=$RUNNER_TEMP/journiful-upload.keystore"
            echo "JOURNIFUL_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "JOURNIFUL_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "JOURNIFUL_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> ~/.gradle/gradle.properties

      # Version identity comes from app.json, not a gradle property: the
      # generated build.gradle does not read Capacitor's old
      # -PversionNameOverride, so CI writes the identity into the config
      # before prebuild and gradle reads it from there. Note what that costs
      # the two cache keys below, which is the reason neither of them hashes
      # app.json.
      - name: Stamp the build version
        run: |
          BRANCH_NAME="$(printf '%s' "$BRANCH_NAME" | tr '/' '-')"
          node -e '
            const fs = require("fs");
            const file = "apps/mobile/app.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.expo.version = process.env.BRANCH_NAME + "-" + process.env.SHA;
            config.expo.android.versionCode = Number(process.env.RUN_NUMBER);
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '
        env:
          # Through the environment, never interpolated into the script: this
          # value is contributor-controlled on a PR (it is the branch name),
          # a branch name can contain a command substitution, and this step
          # runs after the upload keystore has been written to disk.
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: Prebuild the Android project
        run: pnpm --filter @journiful/mobile exec expo prebuild -p android --clean

      # Installing ccache is the whole of this step, because React Native
      # already wired the rest: `ReactNative-application.cmake` is what the
      # generated app CMakeLists includes (the `project(appmodules)` build),
      # and it does `find_program(ccache)` and points `RULE_LAUNCH_COMPILE`
      # and `RULE_LAUNCH_LINK` at it. Reanimated 4.5 is ccache-aware too —
      # down to passing `-Xclang -fno-pch-timestamp` so its precompiled
      # header can be reused. Nothing in this repository has to change.
      #
      # It is worth what it costs because the native C++ is where a device
      # pass actually goes. `--clean` prebuild regenerates android/ and a
      # fresh install wipes every `.cxx` directory, so every one of the ~49
      # `configureCMake*`/`buildCMake*` tasks ran on each of the four runs
      # measured, and not one of them came from the build cache: AGP
      # does not mark them cacheable, so gradle cannot help here and ccache
      # is the only cache that survives the next checkout. The app module
      # alone is 209s of an 11m52s run and 383s of a 16m35s one, and its four
      # ABIs run back to back (gradle runs one task per project at a time),
      # with reanimated's C++ about 320s across the four.
      #
      # The Expo modules, screens, worklets and gesture-handler do not opt
      # in, so this is not all of the C++: roughly the app and reanimated,
      # which is the majority of it.
      #
      # `CCACHE_DIR` and `CCACHE_COMPILERCHECK` are the two settings that
      # matter here. The directory is named rather than left to ccache's
      # default under $HOME so the three steps that touch it agree. The
      # compiler check is content because ccache's default is the compiler's
      # mtime and every file in this job is written fresh on every run; the
      # mtime check misses every time on CI, which is why the React Native
      # docs call it out. Sloppiness is what PCH reuse requires.
      #
      # The install is best effort on purpose. An accelerator that can turn a
      # green build red — an apt mirror having a bad minute — is a worse trade
      # than a slow build, and the stats step below says plainly when ccache
      # was not there, so a degraded run is legible rather than silent.
      - name: Install and configure ccache
        continue-on-error: true
        run: |
          command -v ccache || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache; }
          ccache --version | head -1
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      # The run id in the key is deliberate. A key that has already been saved
      # can never be saved again, so a fixed key would freeze this cache at
      # whatever the first run happened to compile; a fresh entry per run plus a
      # prefix restore is what keeps it growing. The prefix is the whole
      # lockfile hash rather than a bare `-ccache-`, because restoring across a
      # lockfile change would hand ccache objects compiled against a different
      # dependency tree.
      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ hashFiles('pnpm-lock.yaml') }}-

      # What a device pass actually waits for: `--clean` regenerates the
      # whole android/ project every run, so without a cache gradle compiles
      # every native module — React Native, the Expo modules, Hermes — from
      # source each time, which is 23 to 25 minutes measured across three
      # runs. `~/.gradle/caches` carries both the downloaded dependencies
      # and gradle's own build cache, so task outputs whose inputs have not
      # changed replay instead of rebuilding; a JS-only change leaves every
      # native input alone, which is exactly the case a device pass is.
      #
      # Keyed on the lockfile and the app's dependencies, not on the generated
      # gradle files: those do not exist until prebuild has run, which is
      # after this step has to. And not on app.json either, which the version
      # stamp above rewrites on every run: a key that hashes it is a new key
      # every time, so it never hits, only the prefix match below does any
      # work, and the post step uploads another 1.9 GB entry. That is how this
      # repository's cache came to hold four of them and 8.99 GB of a 10 GB
      # quota. Neither `version` nor `versionCode` reaches the native inputs.
      #
      # Dropping a file from this key cannot make a build stale: the key only
      # decides which bundle of caches is restored, and gradle keys its own
      # entries on the real task inputs, so a coarser key restores less and
      # never restores something wrong.
      #
      # `restore-keys` is what makes the saving real on an ordinary push — a
      # miss on the exact key still restores the last prefix match instead of
      # starting cold.
      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Two ABIs, not four. The app module's native build is serial by
      # construction — gradle runs one task per project at a time — so the
      # four ABIs of `:app` are four configure-and-build pairs back to back at
      # the very end of the build, which is why they are the tail of the job
      # and not something that overlaps with it. `armeabi-v7a` is 32-bit ARM
      # and `x86` is a 32-bit emulator image nothing here runs.
      #
      # `x86_64` stays and is the one of the four worth its minutes: the APK a
      # PR uploads is how this app reaches the Windows emulator, because a host
      # whose ANDROID_HOME is the Windows SDK cannot run `make android-apk` at
      # all. A local build still builds all four; this flag is CI's. If a
      # 32-bit device ever needs a build, this is the line to change.
      - name: Build release APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g

      # The number that says whether the cache above is worth its restore: a
      # warm ccache turns those C++ compiles into copies, a cold one leaves the
      # job where it was. It goes to both places on purpose — the log is where
      # the next investigation starts, and the summary is where it is read.
      - name: ccache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            STATS="$(ccache -s)"
          else
            STATS="ccache is not installed, so every C++ compile in this run was from source."
          fi
          printf '%s\n' "$STATS"
          {
            echo "### ccache"
            echo '```'
            printf '%s\n' "$STATS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  distribute:
    name: Distribute to Firebase
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: apps/mobile/android/app/build/outputs/apk/release/

      - name: Write Google Services JSON
        run: |
          cat << 'EOF' > /tmp/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Extract Firebase App ID
        run: |
          FIREBASE_APP_ID="$(jq -r '.client[0].client_info.mobilesdk_app_id' /tmp/google-services.json)"
          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "ERROR: Could not extract mobilesdk_app_id from google-services.json" >&2
            exit 1
          fi
          echo "FIREBASE_APP_ID=$FIREBASE_APP_ID" >> $GITHUB_ENV

      - name: Write service account credentials
        run: |
          cat << 'EOF' > /tmp/firebase-sa.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      # Same rule as the version stamp above, and this one reaches the
      # release notes: the ref name goes through the environment.
      #
      # The text is the whole squash body of the tip commit, and App
      # Distribution caps release notes: past the limit it answers HTTP 400
      # "Release notes length exceeds maximum character limit" and the deploy
      # step dies. #236 squashed a 22,705-byte message and took the
      # distribution down with it, twice, until the tip moved on.
      #
      # The cap is undocumented and has moved, so the number below is a
      # judgement rather than a citation: App Distribution staff quoted 65,536
      # *bytes* in 2021 and 2023, the failures reported from 2024 onward land
      # at 16,384 *characters*, and our own data agrees with the smaller one —
      # 22,705 bytes fails under either reading while an 8,568-byte body
      # passes, which only makes sense if characters are what is counted. 16000
      # sits under both.
      #
      # Truncating by code point rather than by byte is the other half of this:
      # the commit messages here carry em dashes, and `head -c` would hand
      # Firebase a file ending in half a character. Nothing is lost either way
      # — the marker names the commit the rest is in.
      - name: Generate release notes with branch name
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const MAX = 16000;
            const prefix = "[" + process.env.REF_NAME.replace(/\//g, "-") + "] ";
            const message = execFileSync("git", ["log", "-1", "--pretty=%B"], {
              encoding: "utf8",
            }).trim();
            const full = prefix + message;
            const notes = [...full];
            if (notes.length <= MAX) {
              fs.writeFileSync("/tmp/release-notes.txt", full + "\n");
            } else {
              const url =
                "https://github.com/" +
                process.env.GITHUB_REPOSITORY +
                "/commit/" +
                process.env.GITHUB_SHA;
              const marker = "\n\n[truncated; the rest is in " + url + "]";
              const kept = notes.slice(0, MAX - [...marker].length).join("");
              fs.writeFileSync("/tmp/release-notes.txt", kept + marker + "\n");
              console.log(
                "::warning::Release notes truncated from " +
                  notes.length +
                  " to " +
                  MAX +
                  " characters"
              );
            }
          '

      - name: Distribute to Firebase
        run: |
          ARGS=()
          if [ -n "$FIREBASE_TESTERS" ]; then
            ARGS+=(--testers "$FIREBASE_TESTERS")
          fi
          firebase appdistribution:distribute \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes-file /tmp/release-notes.txt \
            "${ARGS[@]}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_TESTERS }}

      - name: Cleanup temp files
        if: always()
        run: rm -f /tmp/firebase-sa.json /tmp/release-notes.txt /tmp/google-services.json
